# Alembic config (audit M: replace startup ad-hoc DDL with Alembic).
# NOTE: keep this file ASCII-only - alembic reads it with the system locale
# encoding on Windows (cp950), non-ASCII bytes break AlembicConfig.
# The real DB URL is injected by alembic/env.py from the app settings
# (.env DATABASE_URL); the sqlalchemy.url below is a placeholder.
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
