[project]
name = "ai-document-v3-backend"
version = "0.1.0"
description = "AI Document V3 backend"
readme = "../README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sqlalchemy",
  "alembic",
  "pydantic-settings",
  "psycopg2-binary",
  "pydantic[email]",
  "python-jose[cryptography]",
  "passlib[bcrypt]",
  "bcrypt==4.0.1",
  "python-multipart",
  "pdfminer.six",
  "pdfplumber",
  "httpx",
  "faiss-cpu",
  "numpy",
  "pymupdf",
  "Pillow",
  "slowapi",
  # 簡體→台灣正體。提示詞的「嚴禁簡體」實測會被忽略，改用確定性轉換。
  # 選 opencc-python-reimplemented（Apache 2.0）而非 zhconv（GPLv2+）：
  # 本專案會打包成 .exe 散布，GPL 的傳染性會波及整個作品。
  "opencc-python-reimplemented",
  # PaddleOCR / PaddlePaddle 版本鎖：
  # paddlepaddle 3.3.x 在 Windows CPU 上 PIR + onednn 新執行器有 regression
  # (ConvertPirAttribute2RuntimeAttribute not support [pir::ArrayAttribute<...>])，
  # 導致 PPStructureV3 layout 模型 predict 失敗。
  # 上游未修：https://github.com/PaddlePaddle/Paddle/issues/77340
  # 社群實測可用組合：paddlepaddle 3.2.2 + paddleocr 3.4.1
  "paddleocr==3.4.1",
  "paddlepaddle==3.2.2",
  # PPStructureV3 需要 paddlex[ocr] 的 extras (lxml / beautifulsoup4 / openpyxl /
  # scikit-learn / scipy / sentencepiece / tiktoken / einops 等)，否則 build pipeline
  # 會丟 DependencyError。
  "paddlex[ocr]==3.4.3",
  # Gemini 雲端 provider 用「現行」官方 SDK；舊的 google-generativeai 已棄用。
  "google-genai",
  # RAG rerank（撈寬再精選）：cross-encoder 重排，在 CPU 跑、不與 Ollama 搶 GPU。
  # torch 鎖 CPU index（見 [tool.uv.sources]），避免誤抓 CUDA 版讓 .exe 暴肥。
  "torch",
  "sentence-transformers",
]

[tool.uv]
package = false

# torch 一律從 PyTorch CPU index 取（跨平台都不抓 CUDA 版）。
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
